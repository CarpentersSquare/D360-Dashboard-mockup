<style>
:root{--bg:#f1eff6;--surface:#fff;--fg:#1d1a2b;--muted:#6b6680;--line:#e3dfee;--brand-a:#7b3fe4;--brand-b:#e2479b;
--logo-light:block;--logo-dark:none;--display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
padding:14px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:12px}
.card {
  border-radius: 18px; overflow: hidden; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 14px 40px -22px rgba(90, 40, 160, .45);
}
.card-top { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { order: 2; flex: none; line-height: 0; display: block; border-radius: 6px; }
.brand:focus-visible { outline: 3px solid var(--brand-a); outline-offset: 3px; }
.brand img { height: 40px; width: auto; }
.logo-on-light { display: var(--logo-light, block); }
.logo-on-dark { display: var(--logo-dark, none); }
.who { min-width: 0; }
.who h1 { margin: 0; font-family: var(--display); font-size: clamp(20px, 6vw, 24px); line-height: 1.1; font-weight: 700; text-wrap: balance; }
.who p { margin: 4px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }
.tagline {
  margin: 0; padding: 0 18px 12px; list-style: none; color: var(--fg); font-size: 12.5px; font-weight: 600; line-height: 1.3;

  display: flex; flex-wrap: nowrap; justify-content: center; white-space: nowrap; overflow: hidden;
}
.tagline li + li::before { content: "|"; color: var(--brand-a); margin: 0 .6em; }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:0}
.panel h2{margin:4px 0 2px;font-family:var(--display);font-size:20px}
.panel .lede{margin:0 0 10px;color:var(--muted);font-size:14px}
.hs-form-frame{min-height:420px}
.fallback{font-size:13px;color:var(--muted);text-align:center;margin:8px 0}
.fallback a{color:var(--brand-a)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:0}
.foot a{color:inherit}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" aria-label="Business card">

      <a class="brand" href="https://dial360.ai/" target="_blank" rel="noopener" aria-label="Dial360 website">

  <section class="panel">
    <p class="eyebrow">Nice to meet you</p>
    <h2>Leave your details</h2>
    <p class="lede">I'll be in touch about how Dial360 can help your team.</p>
    <div class="hs-form-frame" data-region="eu1" data-form-id="d93bd252-6173-407d-9ec4-eda840d4308a" data-portal-id="148369146"></div>
    <p class="fallback">Form not showing? <a href="https://2gc2d6.share-eu1.hsforms.com/22TvSUmFzQH2exO2oQNQwig">Open it here</a>.</p>
  </section>
  <p class="foot">jack.butler@dial360.ai &middot; <a href="https://dial360.ai/">dial360.ai</a></p>
</main>
